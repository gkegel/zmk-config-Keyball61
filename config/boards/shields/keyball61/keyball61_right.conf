CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# --- PMW3610 Driver Configuration ---
CONFIG_PMW3610=y
# Default trackball sensitivity (CPI/DPI). Higher = faster.
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# Sensitivity when in Snipe mode (lower = more precise).
CONFIG_PMW3610_SNIPE_CPI=400
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
# Scroll speed divisor. Higher = slower scrolling.
CONFIG_PMW3610_SCROLL_TICK=32
# Invert scroll direction.
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# Enable smart algorithm for smoother movement (reduces false movement / drift).
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
# Keep the sensor at full sample rate always (no rest/downshift). Eliminates
# wake-from-rest lag when resuming movement. Costs battery on the trackball half.
CONFIG_PMW3610_FORCE_AWAKE=y
# Polling rate. 250Hz = lowest latency (driver default); 125Hz would save battery.
CONFIG_PMW3610_POLLING_RATE_250=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# Timeout for auto-switching to Mouse layer after trackball movement (ms).
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
# Noise deadzone (driver default 5). Higher = filters more idle jitter/drift.
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
